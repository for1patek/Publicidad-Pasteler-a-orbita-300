<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Órbita 300 · Menú del Día</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/nqkMR2b8/Logo-rbita-300-removebg-preview.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/nqkMR2b8/Logo-rbita-300-removebg-preview.png">
<meta property="og:title" content="Órbita 300 · Menú del Día">
<meta property="og:description" content="El menú del día, actualizado a diario. Frutillar.">
<meta property="og:image" content="https://i.ibb.co/tpQwsj1Q/logo-rbita-2-0.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@1,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #C98A2B;
    --bg:      #08080a;
    --card:    #121216;
    --border:  #2a2a32;
    --text:    #f0f0f5;
    --muted:   #8a8a98;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(28px, 7vw, 44px) clamp(16px, 5vw, 24px) clamp(40px, 10vw, 56px);
  }
  .wrap { width: 100%; max-width: 480px; }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 0.8rem; margin-bottom: 22px; }
  .back:hover { color: var(--text); }

  .hero { text-align: center; padding-bottom: clamp(20px, 5vw, 28px); border-bottom: 2px solid var(--primary); margin-bottom: 24px; }
  .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 6vw, 1.9rem); letter-spacing: 2px; color: var(--text); line-height: 1; font-variant-numeric: lining-nums; }
  .badge-hoy {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    font-size: clamp(2rem, 9vw, 2.7rem);
    color: var(--primary);
    margin: 6px 0 4px;
  }
  .fecha { font-size: clamp(0.75rem, 2.5vw, 0.85rem); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .valor-badge {
    display: inline-block;
    margin-top: 10px;
    background: var(--primary);
    color: #08080a;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: clamp(0.85rem, 3vw, 1rem);
    padding: 6px 16px;
    border-radius: 20px;
  }

  .slider-wrap { position: relative; width: 100%; margin: 0 0 24px; border-radius: 14px; overflow: hidden; aspect-ratio: 4/3; }
  .slider-track { display: flex; height: 100%; transition: transform 0.5s ease; }
  .slide { min-width: 100%; height: 100%; position: relative; overflow: hidden; }
  .slide-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(18px) brightness(0.55);
    transform: scale(1.15);
  }
  .slide-fg {
    position: absolute; inset: 0;
    background-size: contain; background-position: center; background-repeat: no-repeat;
  }
  .slide-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 16px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .slider-dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background 0.2s; }
  .dot.active { background: var(--primary); }

  .menu-list { display: flex; flex-direction: column; }
  .cat-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 3px;
    color: var(--primary);
    border-left: 3px solid var(--primary);
    padding-left: 10px;
    margin: 22px 0 8px;
  }
  .cat-label:first-child { margin-top: 0; }

  .item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: clamp(12px, 3.5vw, 15px) 0;
    border-bottom: 0.5px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item-main { display: flex; gap: 10px; flex: 1; }
  .item-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-top: 7px; flex-shrink: 0; }
  .item-num-badge {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--primary);
    color: #08080a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .item-name { font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 600; color: var(--text); }
  .item-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .item-price { font-size: 0.85rem; font-weight: 600; color: var(--primary); white-space: nowrap; flex-shrink: 0; }

  .nota {
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .estado {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .footer { margin-top: 36px; text-align: center; }
  .contact-btns { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 4px; }
  .contact-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1a1a20; border: 1px solid #2a2a32; transition: transform .2s; }
  .contact-btn:hover { transform: scale(1.1); }
  .contact-btn svg { width: 26px; height: 26px; }
  .pide-aqui {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .pide-aqui-text {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: clamp(0.85rem, 3vw, 1rem);
    color: var(--primary);
    white-space: nowrap;
  }
  .pide-aqui:hover .pide-aqui-text { color: var(--text); }
  .pide-aqui-arrow {
    width: 22px;
    height: 14px;
    animation: nudge 1.4s ease-in-out infinite;
  }
  .pide-aqui-arrow path {
    stroke: var(--primary);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver</a>

    <div class="hero">
      <div class="logo">Órbita 300</div>
      <div class="badge-hoy">MENÚ DEL DÍA</div>
      <div class="fecha" id="fecha">Cargando…</div>
      <div id="valor"></div>
    </div>

    <div id="galeria"></div>

    <div id="contenido">
      <div class="estado">Cargando menú del día…</div>
    </div>

    <div class="footer">
      <div class="contact-btns">
        <a class="pide-aqui" href="https://wa.me/56959835813" target="_blank" aria-label="Pedir por WhatsApp">
          <span class="pide-aqui-text">PIDE AQUÍ</span>
          <svg class="pide-aqui-arrow" viewBox="0 0 22 14" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 7h18M13 1l7 6-7 6"/>
          </svg>
          <span class="contact-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><radialGradient id="wag" cx="11.987" cy="44.637" r="44.222" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#44e000"/><stop offset="1" stop-color="#25d366"/></radialGradient><path fill="url(#wag)" d="M24 4C13 4 4 13 4 24c0 3.7 1 7.1 2.8 10.1L4 44l10.2-2.7C17.1 43 20.5 44 24 44c11 0 20-9 20-20S35 4 24 4z"/><path fill="#fff" d="M34.5 29.2c-.5-.3-3-1.5-3.5-1.7-.5-.2-.8-.3-1.1.2s-1.3 1.7-1.6 2c-.3.4-.6.4-1.1.1-3-1.5-5-2.7-6.9-6.1-.5-.9.5-.8 1.5-2.8.2-.4.1-.7-.1-1-.2-.3-1.1-2.6-1.5-3.6-.4-.9-.8-.8-1.1-.8h-.9c-.3 0-.8.1-1.2.6-.4.5-1.6 1.5-1.6 3.8s1.6 4.4 1.8 4.7c.2.3 3.2 4.9 7.7 6.8 4.6 1.9 4.6 1.3 5.4 1.2.8-.1 2.6-1.1 3-2.1.4-1 .4-1.9.3-2.1-.1-.1-.4-.2-.9-.5z"/></svg>
          </span>
        </a>
      </div>
    </div>
  </div>

  <script>
    async function cargarMenu() {
      const contenido = document.getElementById('contenido');
      const fechaEl = document.getElementById('fecha');
      try {
        const res = await fetch('menu-diario.json?t=' + Date.now());
        if (!res.ok) throw new Error('No se pudo cargar');
        const data = await res.json();

        fechaEl.textContent = data.fecha || '';

        const valorEl = document.getElementById('valor');
        valorEl.innerHTML = data.valor ? `<div class="valor-badge">Valor del menú ${escapeHtml(data.valor)}</div>` : '';

        if (!data.items || data.items.length === 0) {
          contenido.innerHTML = '<div class="estado">Hoy no hay menú del día publicado.<br>¡Vuelve a revisar más tarde!</div>';
          return;
        }

        montarGaleria(data.items);

        // Agrupar por categoría si viene definida; si no, lista plana
        const grupos = {};
        const sinCategoria = [];
        data.items.forEach(it => {
          if (!it.nombre || !it.nombre.trim()) return;
          if (it.categoria) {
            grupos[it.categoria] = grupos[it.categoria] || [];
            grupos[it.categoria].push(it);
          } else {
            sinCategoria.push(it);
          }
        });

        let html = '<div class="menu-list">';

        sinCategoria.forEach(it => { html += renderItem(it); });

        Object.keys(grupos).forEach(cat => {
          html += `<div class="cat-label">${escapeHtml(cat)}</div>`;
          const numerado = cat.toLowerCase().includes('fondo');
          grupos[cat].forEach((it, i) => { html += renderItem(it, numerado ? i + 1 : null); });
        });

        html += '</div>';

        if (data.nota) {
          html += `<div class="nota">${escapeHtml(data.nota)}</div>`;
        }

        contenido.innerHTML = html;
      } catch (err) {
        fechaEl.textContent = '';
        contenido.innerHTML = '<div class="estado">No pudimos cargar el menú del día.<br>Intenta nuevamente en unos minutos.</div>';
      }
    }

    function montarGaleria(items) {
      const conFoto = items.filter(it => it.imagen && it.imagen.trim());
      const galeria = document.getElementById('galeria');
      if (conFoto.length === 0) { galeria.innerHTML = ''; return; }

      const slides = conFoto.map(it => {
        const url = it.imagen.replace(/'/g, "%27");
        return `
        <div class="slide">
          <div class="slide-bg" style="background-image:url('${url}')"></div>
          <div class="slide-fg" style="background-image:url('${url}')"></div>
          <div class="slide-caption">${escapeHtml(it.nombre || '')}</div>
        </div>`;
      }).join('');

      const dots = conFoto.map((_, i) => `<div class="dot${i === 0 ? ' active' : ''}" onclick="irA(${i})"></div>`).join('');

      galeria.innerHTML = `
        <div class="slider-wrap">
          <div class="slider-track" id="track">${slides}</div>
        </div>
        <div class="slider-dots" id="dots">${dots}</div>`;

      if (conFoto.length > 1) iniciarCarrusel(conFoto.length);
    }

    function iniciarCarrusel(total) {
      let actual = 0;
      const track = document.getElementById('track');
      const dots = document.querySelectorAll('#dots .dot');
      let timer;

      window.irA = function(n) {
        actual = (n + total) % total;
        track.style.transform = `translateX(-${actual * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === actual));
      };

      function mover(dir) {
        clearInterval(timer);
        irA(actual + dir);
        timer = setInterval(() => mover(1), 4000);
      }
      timer = setInterval(() => mover(1), 4000);

      let startX = 0;
      track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) mover(diff > 0 ? 1 : -1);
      }, { passive: true });
    }

    function renderItem(it, numero) {
      const marcador = numero
        ? `<span class="item-num-badge">${numero}</span>`
        : `<span class="item-dot"></span>`;
      return `
        <div class="item">
          <div class="item-main">
            ${marcador}
            <div>
              <div class="item-name">${escapeHtml(it.nombre || '')}</div>
              ${it.descripcion ? `<div class="item-desc">${escapeHtml(it.descripcion)}</div>` : ''}
            </div>
          </div>
          ${it.precio ? `<span class="item-price">${escapeHtml(it.precio)}</span>` : ''}
        </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    cargarMenu();
  </script>
</body>
</html>
